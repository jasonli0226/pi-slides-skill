name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: skills/web-slides/template/package-lock.json
      # present-mode tests drive Chromium; install the build matching the template's Playwright
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: skills/web-slides/template
      - run: npm test
