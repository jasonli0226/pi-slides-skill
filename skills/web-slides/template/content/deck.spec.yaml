# Editable design spec — approval artifact between raw notes and React slides.
# Schema: skills/web-slides/references/deck-spec.md
# This file mirrors part of the template example deck (status: locked). Set approved: true
# only after the user explicitly approves the design. Stubs regenerate via `npm run spec`.
title: Agent-authored web decks
theme: midnight
audience: Engineering leads evaluating agent-built decks
goal: Show that research-backed web slides can look keynote-grade and pass automated review
minutes: 12
approved: false
version: 1
notes: |
  Schema sample for the template. Polished slides live in src/slides/*.tsx (locked).
  For a new talk: replace slides with stubs, keep approved false until the user says yes.

slides:
  - n: 1
    id: title
    type: title
    title: Research-backed decks that look like a design team built them.
    layout: layout-stack
    status: locked
    background: aurora
    kicker: Web Slides
    subtitle: React · Vite · Motion · Playwright
    notes: Open on the promise; do not bury the ask.
    components:
      - Pill:
          text: React 19 + Motion
          tone: accent

  - n: 2
    id: agenda
    type: agenda
    title: Four gates sit between a draft and a deck you can ship.
    layout: grid-4
    status: locked
    kicker: Agenda
    steps: 4
    body:
      - Research with sources
      - Design spec you can edit
      - Build and live polish
      - Screenshot review and export
    components:
      - Card:
          icon: Search
          title: Research
      - Card:
          icon: FilePen
          title: Spec
      - Card:
          icon: Sparkles
          title: Build
      - Card:
          icon: ShieldCheck
          title: Review

  - n: 3
    id: contrast-floor
    type: big-number
    title: Ticket triage time fell 48% after the pilot.
    layout: layout-hero
    status: locked
    kicker: Results
    sources: [pilotReport]
    notes: Speak to the median; the bar chart is the receipt.
    components:
      - Stat:
          value: 48
          suffix: "%"
          label: median triage drop
          cite: pilotReport
          size: xl
      - BarChart:
          cite: pilotReport
          highlight: 1
          unit: min
          data:
            - { label: Before, value: 42 }
            - { label: After, value: 22 }

  - n: 4
    id: architecture
    type: architecture
    title: Agents write a design spec before they touch React.
    layout: layout-media
    status: locked
    kicker: Architecture
    sources: [skillRepo]
    notes: Illustrative workflow — not a real-repo architecture, so there is no file:line evidence.
    mermaid: |
      flowchart LR
        U[User notes] --> S[deck.spec.yaml]
        S --> A{approved?}
        A -->|yes| R[React slides]
        R --> V[review + PDF]
    components:
      - Mermaid:
          illustrative: true
          chart: |
            flowchart LR
              U[User notes] --> S[deck.spec.yaml]
              S --> A{approved?}
              A -->|yes| R[React slides]
              R --> V[review + PDF]

  - n: 5
    id: layered-platform
    type: architecture
    title: Dense stacks use swimlanes instead of a Mermaid hairball.
    layout: layout-stack
    status: locked
    kicker: Diagrams
    sources: [c4Diagrams, azureDiagrams]
    steps: 4
    notes: Illustrative generic stack — no file:line pins. Present mode walks Web app → API gateway → Orchestrator → Vector index.
    components:
      - LayeredArchitecture:
          illustrative: true
          stepwise: path
          primary_path: [web-app, api-gateway, orchestrator, vector-index]
          caption: Illustrative agent platform stack
          leftRail: { label: Trust, tone: muted, items: [Identity, Policy] }
          rightRail: { label: Operate, tone: accent-2, items: [Observe, Deploy] }
          layers:
            - id: experience
              label: Experience
              tone: accent
              items:
                - { id: web-app, label: Web app, sub: React, icon: Bot }
                - { id: admin, label: Admin, sub: "Ops console" }
                - { id: api-clients, label: API clients, sub: Partners }
            - id: edge
              label: Edge
              tone: accent-2
              items:
                - { id: api-gateway, label: API gateway, sub: "Auth · rate limit", highlight: true, icon: Network }
                - { id: cdn, label: CDN / WAF, sub: "Edge cache" }
                - { id: stream-gateway, label: Stream gateway, sub: "SSE / WS" }
            - id: ai
              label: AI services
              tone: accent-3
              items:
                - { id: orchestrator, label: Orchestrator, sub: "Agents · tools", highlight: true, icon: Bot }
                - { id: rag, label: RAG service, sub: "Retrieve · rank" }
                - { id: model-router, label: Model router, sub: "SLA · cost" }
                - { id: eval, label: Eval harness, sub: "Offline · online" }
            - id: data
              label: Data
              tone: muted
              items:
                - { id: vector-index, label: Vector index, sub: Embeddings, icon: Database }
                - { id: feature-store, label: Feature store, sub: "Online / offline" }
                - { id: kubernetes, label: Kubernetes, sub: Services, icon: Server }
                - { id: gpu-pool, label: GPU pool, sub: Inference }

  - n: 6
    id: workflow
    type: timeline
    title: Ship the deck in one working session, not a week of polish.
    layout: layout-stack
    status: locked
    kicker: Timeline
    steps: 4
    timeline:
      - { when: "0:15", title: Brief and research }
      - { when: "0:30", title: Spec + user approval }
      - { when: "1:30", title: Build stubs, lock polish }
      - { when: "2:00", title: Review, PDF, hand-off }

  - n: 7
    id: results
    type: results
    title: Automated review catches the mistakes humans miss under deadline.
    layout: layout-kpi
    status: locked
    kicker: Measured
    sources: [skillRepo]
    components:
      - Stat:
          value: 0
          label: review errors to ship
          cite: skillRepo
          size: lg
      - Stat:
          value: 16
          label: example slide types
          cite: skillRepo
          size: md

  - n: 8
    id: closing
    type: closing
    title: Approve the design spec, then let the agent build the stage.
    layout: layout-stack
    status: locked
    background: aurora
    kicker: Next
    notes: Leave with the ask — edit the YAML, approve, regenerate stubs, polish locked slides.
    body:
      - Edit content/deck.spec.yaml
      - Set approved true after you sign off
      - npm run spec && npm run live

  - n: 9
    id: trend-chart
    type: results
    title: Trend charts accent the one series the title is about and mute the rest.
    layout: grid-2
    status: locked
    kicker: Charts • EChart
    notes: Illustrative data only. Swap in a sourced dataset and cite it, or delete the slide.
    components:
      - EChart:
          illustrative: true
          highlight: Team A
          label: Lint errors per deck over eight weeks for three teams; Team A falls from 14 to 2.
          option:
            xAxis: { type: category, data: [W1, W2, W3, W4, W5, W6, W7, W8] }
            yAxis: { type: value, min: 0 }
            series:
              - { name: Team A, type: line, data: [14, 12, 9, 7, 5, 4, 3, 2] }
              - { name: Team B, type: line, data: [12, 13, 11, 12, 10, 11, 10, 9] }
              - { name: Team C, type: line, data: [15, 14, 15, 13, 14, 12, 12, 11] }

  - n: 10
    id: c4-context
    type: architecture
    title: C4 context shows who is in the picture before you open the stack.
    layout: layout-stack
    status: locked
    kicker: Diagram · C4 context · illustrative
    sources: [c4Diagrams, c4Notation]
    steps: 3
    notes: Illustrative system context — no file:line evidence. Present mode walks Analyst → AI Platform → Corp docs.
    components:
      - C4Container:
          illustrative: true
          level: context
          stepwise: path
          primary_path: [user, platform, docs]
          caption: Illustrative system context — one happy-path request
          cols: 3
          rows: 3
          legend: true
          nodes:
            - { id: llm, label: Model vendor, kind: external, description: "Hosted LLM API", row: 1, col: 2 }
            - { id: user, label: Analyst, kind: person, description: "Asks in natural language", row: 2, col: 1 }
            - { id: platform, label: AI Platform, kind: system, description: "Answers with grounded tools", tech: illustrative, highlight: true, row: 2, col: 2 }
            - { id: docs, label: Corp docs, kind: external, description: "Wiki · files", row: 3, col: 1 }
            - { id: ticket, label: ITSM, kind: external, description: "Tickets · CMDB", row: 3, col: 3 }
          relations:
            - { from: user, to: platform, label: "Asks / reviews" }
            - { from: platform, to: llm, label: Completions }
            - { from: platform, to: docs, label: Retrieves }
            - { from: platform, to: ticket, label: "Opens ticket", dashed: true }

  - n: 11
    id: chat-sequence
    type: architecture
    title: After the overview, walk one request so the room can follow the path.
    layout: layout-stack
    status: locked
    kicker: Diagram · sequence · illustrative
    sources: [archPresenting]
    steps: 6
    notes: Illustrative chat turn — no file:line evidence. Sequence uses stepwise path; FlowSteps is a static summary.
    components:
      - FlowSteps:
          illustrative: true
          steps:
            - { id: ask, title: Ask, body: "User prompt", tone: accent-3 }
            - { id: ground, title: Ground, body: "Retrieve docs", tone: accent-2 }
            - { id: reason, title: Reason, body: "Model + tools", tone: accent }
            - { id: answer, title: Answer, body: "Stream + cite", tone: accent }
      - Sequence:
          illustrative: true
          stepwise: path
          primary_path: [0, 1, 2, 3, 4, 5]
          actors:
            - { id: u, label: User, tone: accent-3 }
            - { id: gw, label: Gateway, tone: accent-2 }
            - { id: or, label: Orchestrator, tone: accent }
            - { id: m, label: Model, tone: muted }
          messages:
            - { from: u, to: gw, label: "Chat request" }
            - { from: gw, to: or, label: "Auth'd prompt" }
            - { from: or, to: m, label: "Tool-aware call" }
            - { from: m, to: or, label: Tokens, dashed: true }
            - { from: or, to: gw, label: "Grounded answer", dashed: true }
            - { from: gw, to: u, label: "Streamed reply", dashed: true }
